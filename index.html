<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <title>فروشگاه من</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #store {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        #error {
            display: none;
            position: fixed;
            inset: 0;
            background: #ffffff;
            color: #222222;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-family: Tahoma, Arial, sans-serif;
            line-height: 2;
        }
    </style>
</head>

<body>

    <iframe
        id="store"
        src="https://floch3.blogix.ir/"
        title="فروشگاه"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div id="error">
        <div>
            <h3>امکان نمایش فروشگاه وجود ندارد</h3>
            <p>
                ممکن است سایت مقصد نمایش داخل iframe را مسدود کرده باشد.
                برای نمایش آن روی دامنه خودتان، به راهکار سازگار با
                تنظیمات و مجوزهای سایت مقصد نیاز دارید.
            </p>
        </div>
    </div>

</body>
</html>
